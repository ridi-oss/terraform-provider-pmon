# Publishes the OAuth Client ID Metadata Document.
#
# pmon resolves this provider's client_id by fetching it over HTTPS, so it has to be
# reachable at exactly the URL named inside the document. Pages serves .json as
# application/json, which pmon requires.
#
# Manual only, and deliberately so. The document names ridi-oss.github.io as its own client_id,
# and pmon compares that against the URL it fetched byte for byte. Run from a repository under
# any other owner, this publishes a document that fails its own self-reference check -- at the
# same path a working deployment may already be serving from a branch. Enable the push trigger
# once the repository owner matches the client_id inside client-metadata.json.
name: Publish client metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the document
        run: |
          mkdir -p _site
          cp client-metadata.json _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
